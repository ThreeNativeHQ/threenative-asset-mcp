name: Rig regressions

on:
  push:
    branches: [fix/pr237-retarget-hands]
  pull_request:
    paths:
      - src/rig/**
      - src/tools/rig.ts
      - tests/rig-*.ts
      - package.json
      - package-lock.json
      - .github/workflows/rig-regressions.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rig-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      FAB_BROWSER_HEADLESS: "true"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python for local creature fixtures
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      # The hand fix ships in the published GLB, so this leg runs the whole suite and
      # needs the same prerequisites CI does. npm, pip, apt and Playwright downloads
      # can stall; fail in 15 min instead of at the 45-min job limit.
      - name: Install deterministic test prerequisites
        timeout-minutes: 15
        run: |
          npm ci --no-audit --no-fund
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 pillow==12.0.0
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          npx --no-install playwright install --with-deps chromium

      - name: Provision the modern Unreal converter
        timeout-minutes: 15
        run: |
          npx tsx -e 'import { ensureModernConverter } from "./src/unreal/provision.ts"; ensureModernConverter(process.env, console.error).catch(error => { console.error(error); process.exitCode = 1; });'

      - run: npm run typecheck

      # Each integration file can launch Chromium, Python and installed MCP
      # processes. Bound concurrency instead of weakening existing deadlines.
      # npm test builds first, so the cancellation test finds dist/index.js.
      - run: npm test -- --maxWorkers=1
