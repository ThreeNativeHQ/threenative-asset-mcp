name: Fresh toolchain

on:
  pull_request:
    branches: [main]
    paths:
      - src/unreal/provision.ts
      - src/unreal/toolchain.ts
      - src/unreal/cue4parse-adapter.ts
      - src/fab/fabcli.ts
      - scripts/provision-toolchain.ts
      - .github/workflows/fresh-toolchain.yml
  push:
    branches: [main]
    paths:
      - src/unreal/provision.ts
      - src/unreal/toolchain.ts
      - src/unreal/cue4parse-adapter.ts
      - src/fab/fabcli.ts
      - scripts/provision-toolchain.ts
      - .github/workflows/fresh-toolchain.yml
  # Upstream archives change without a commit here, so provisioning can break between runs.
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fresh-toolchain:
    name: Provision from an empty cache (Debian 13)
    runs-on: ubuntu-24.04
    container: debian:13
    timeout-minutes: 60
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install provisioning prerequisites
        timeout-minutes: 15
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates curl git tar xz-utils g++ make perl zlib1g-dev libpng-dev libsdl2-dev python3 python3-venv libicu76 libwebkit2gtk-4.1-0

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        timeout-minutes: 15
        run: npm ci --no-audit --no-fund

      - name: Check the toolchain doctor
        run: npm run doctor -- --toolchain-only

      - name: Provision the toolchain from an empty cache
        env:
          THREENATIVE_TOOLCHAIN_DIR: ${{ runner.temp }}/toolchain
        run: |
          set -o pipefail
          npm run provision:toolchain 2>&1 | tee "$RUNNER_TEMP/provision.log"

      # CI=true turns a missing .NET SDK or SharpGLTF assembly into a failure, so this step cannot skip the suite.
      - name: Compile the UE5 source decoders against the fresh toolchain
        env:
          CI: "true"
          THREENATIVE_TOOLCHAIN_DIR: ${{ runner.temp }}/toolchain
        run: npx vitest run tests/unreal-converter-ue5-sources.test.ts

      - name: Summarize provisioning
        if: always()
        run: |
          {
            printf '## Fresh-host toolchain (Debian 13 amd64)\n\n```text\n'
            grep -E '^(ok |FAIL |provision-toolchain: |        )' "$RUNNER_TEMP/provision.log" 2>/dev/null || true
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
