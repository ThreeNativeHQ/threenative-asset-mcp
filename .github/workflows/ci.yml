name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Minimum advertised runtime and current LTS; keep the minimum aligned with engines.node.
        node: ["20.19.0", "24.x"]
    env:
      CI: "true"
      FAB_BROWSER_HEADLESS: "true"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python for local creature fixtures
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      # npm, pip, apt and Playwright downloads can stall; fail in 15 min instead of at the 45-min job limit.
      - name: Install deterministic test prerequisites
        timeout-minutes: 15
        id: install
        run: |
          npm ci --no-audit --no-fund
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 pillow==12.0.0
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          npx --no-install playwright install --with-deps chromium

      # The compiled UE5 decoder suite fails under CI=true without the modern converter; bound its provisioning too.
      - name: Provision the modern Unreal converter
        timeout-minutes: 15
        run: |
          npx tsx -e 'import { ensureModernConverter } from "./src/unreal/provision.ts"; ensureModernConverter(process.env, console.error).catch(error => { console.error(error); process.exitCode = 1; });'

      - name: Typecheck
        id: typecheck
        run: npm run typecheck

      - name: Build the distributable
        id: build
        run: npm run build

      - name: Run deterministic test suite
        id: tests
        run: npm run test:ci

      - name: Smoke-test built and packed stdio MCP
        id: smoke
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:smoke

      - name: Keep test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-reports-node-${{ matrix.node }}
          path: artifacts/ci/*.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Keep visual-regression diffs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-diff-node-${{ matrix.node }}
          path: artifacts/ci/visual-diff/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Summarize verification
        if: always()
        env:
          NODE_VERSION: ${{ matrix.node }}
          INSTALL_RESULT: ${{ steps.install.outcome }}
          TYPECHECK_RESULT: ${{ steps.typecheck.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          SMOKE_RESULT: ${{ steps.smoke.outcome }}
        run: |
          {
            printf '## Node %s verification\n\n' "$NODE_VERSION"
            printf '| Check | Result |\n| --- | --- |\n'
            printf '| Lockfile install and fixture prerequisites | %s |\n' "$INSTALL_RESULT"
            printf '| Typecheck | %s |\n' "$TYPECHECK_RESULT"
            printf '| Build | %s |\n' "$BUILD_RESULT"
            printf '| Deterministic tests | %s |\n' "$TEST_RESULT"
            printf '| Built and npm-packed stdio smoke | %s |\n\n' "$SMOKE_RESULT"
            printf 'Provider HTTP boundaries use fixtures. No live provider probes, credentials, or publishing run in CI.\n\n'
            printf 'Local proprietary Unreal asset regressions remain conditional on their fixtures; inspect the JUnit reports for skipped tests.\n'
          } >> "$GITHUB_STEP_SUMMARY"

  # parallel: races and load timeouts only show under default workers. leak-gate: temp dirs a run leaves behind.
  suite:
    name: ${{ matrix.leg }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        leg: [parallel, leak-gate]
    env:
      CI: "true"
      FAB_BROWSER_HEADLESS: "true"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python for local creature fixtures
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install deterministic test prerequisites
        timeout-minutes: 15
        run: |
          npm ci --no-audit --no-fund
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 pillow==12.0.0
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          npx --no-install playwright install --with-deps chromium

      # The compiled UE5 decoder suite fails under CI=true without the modern converter; bound its provisioning too.
      - name: Provision the modern Unreal converter
        timeout-minutes: 15
        run: |
          npx tsx -e 'import { ensureModernConverter } from "./src/unreal/provision.ts"; ensureModernConverter(process.env, console.error).catch(error => { console.error(error); process.exitCode = 1; });'

      - name: Build the distributable
        run: npm run build

      - name: Run every suite with default workers
        if: matrix.leg == 'parallel'
        run: npx vitest run --reporter=default --reporter=junit --outputFile=artifacts/ci/parallel.xml

      - name: Run every suite under the temp-leak gate
        if: matrix.leg == 'leak-gate'
        run: npx tsx scripts/leak-gate.ts --dir "$RUNNER_TEMP/suite-tmp" -- vitest run

      - name: Keep test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-reports-${{ matrix.leg }}
          path: artifacts/ci/*.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Keep visual-regression diffs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-diff-${{ matrix.leg }}
          path: artifacts/ci/visual-diff/*.png
          if-no-files-found: ignore
          retention-days: 7
